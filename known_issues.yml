# Triaged findings. `status: open` collapses the group in the nightly issue,
# `status: merged` turns any reappearance into a regression report.
# Match by exact signature (`signatures`) or by `signature_regex`.
# Optional `cops` must all be present in the finding.

- pr: 15922
