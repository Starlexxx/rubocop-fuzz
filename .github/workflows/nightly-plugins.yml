name: nightly-plugins

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        plugin: [rubocop-performance, rubocop-rails, rubocop-rspec, rubocop-minitest]
        slice: [0, 1, 2, 3, 4, 5]
        include:
          - plugin: rubocop-performance
            department: Performance
            corpus: gems
            tiers: baseline packed interactions
            sweep_shards: ''
          - plugin: rubocop-rails
            department: Rails
            corpus: repos
            tiers: baseline packed
            sweep_shards: --shards-per-config 10
          - plugin: rubocop-rspec
            department: RSpec
            corpus: repos
            tiers: baseline packed
            sweep_shards: --shards-per-config 10
          - plugin: rubocop-minitest
            department: Minitest
            corpus: repos
            tiers: baseline packed
            sweep_shards: --shards-per-config 10
    steps:
      - name: Set scan deadline
        run: echo "SCAN_DEADLINE=$(( $(date +%s) + 315 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rubocop/rubocop
          path: rubocop
      - uses: actions/checkout@v4
        with:
          repository: rubocop/${{ matrix.plugin }}
          path: plugin
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install rubocop dependencies
        run: bundle install
        working-directory: rubocop
      - name: Fetch gem corpus
        if: matrix.corpus == 'gems'
        run: |
          script/fetch-corpus corpus
          script/fetch-fresh-corpus corpus 100
      - name: Fetch repo corpus
        if: matrix.corpus == 'repos'
        run: script/fetch-repos corpus
      - name: Scan
        run: |
          for tier in ${{ matrix.tiers }} sweep; do
            extra=''
            case $tier in
              interactions) extra='--shards-per-config 2' ;;
              sweep) extra="--config-filter ^${{ matrix.department }}/ ${{ matrix.sweep_shards }}" ;;
            esac
            ruby exe/rubocop-fuzz scan --deadline "$SCAN_DEADLINE" \
              --rubocop rubocop --plugin ${{ matrix.plugin }}=plugin --gems-dir corpus \
              --tier $tier $extra \
              --shard-slice ${{ matrix.slice }}/6 \
              --out fuzz-out/$tier
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-findings-${{ matrix.plugin }}-${{ matrix.slice }}
          path: fuzz-out/
          if-no-files-found: ignore

  report:
    needs: fuzz
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Open issue when plugin findings exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          : > body.md
          for entry in rubocop-performance:Performance rubocop-rails:Rails rubocop-rspec:RSpec rubocop-minitest:Minitest; do
            plugin=${entry%%:*}
            department=${entry##*:}
            find artifacts -path "*plugin-findings-$plugin-*" -name findings.jsonl -exec cat {} + > "$plugin.jsonl" 2>/dev/null || true
            [ -s "$plugin.jsonl" ] || continue
            echo "# $plugin" >> body.md
            echo >> body.md
            ruby exe/rubocop-fuzz triage \
              --findings "$plugin.jsonl" --known known_issues.yml \
              --cops "^$department/" | sed 's/^## /### /' >> body.md
            echo >> body.md
          done
          if [ -s body.md ]; then
            gh issue list --label nightly-plugins --state open --json number --jq '.[].number' \
              | xargs -r -I{} gh issue close {} --comment "Superseded by the next nightly run."
            gh issue create \
              --title "Nightly plugin findings $(date -u +%F)" \
              --body-file body.md \
              --label nightly-plugins
          fi
